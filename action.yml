name: Cargo Save Cost
description:
  Intelligently run Rust workspace tests based on changed crates and
  dependencies
author: Claude Code

branding:
  icon: check-circle
  color: orange

inputs:
  workspaceRoot:
    description: Path to the Cargo workspace root
    required: false
    default: '.'
  baseRef:
    description: Base git reference (branch/commit) for comparison
    required: false
  headRef:
    description: Head git reference (branch/commit) for comparison
    required: false
  all:
    description: Test all crates in the workspace regardless of changes
    required: false
    default: 'false'
  verbose:
    description: Enable verbose output for cargo commands
    required: false
    default: 'false'

outputs:
  testCount:
    description: Total number of crates tested
  passedCount:
    description: Number of passed test crates
  failedCount:
    description: Number of failed test crates

runs:
  using: node24
  main: dist/index.js
